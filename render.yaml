# Render Blueprint: приложение из готового Dockerfile + управляемый PostgreSQL.
# Развёртывание: Render → New → Blueprint → выбрать этот репозиторий.
# Код приложения не меняется — образ тот же, что проверен локально.
services:
  - type: web
    name: bilimhub
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      # Подключение подставляется Render'ом из базы ниже
      - key: DATABASE_URL
        fromDatabase:
          name: bilimhub-db
          property: connectionString
      # Секреты генерирует Render — в репозитории их нет
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # ФС контейнера эфемерна (при рестарте очищается) → файлы храним в БД
      - key: FILE_STORAGE
        value: db
      # Бесплатный инстанс засыпает при простое: пересчёт рейтинга делаем
      # в запросе, чтобы он не терялся вместе с уснувшим процессом
      - key: JOBS_INLINE
        value: "1"
      - key: PAYMENT_PROVIDER
        value: mock
      # dev — код входа виден на странице (демо-режим).
      # Для реальных учеников: http + SMS_HTTP_URL/SMS_HTTP_TOKEN
      - key: SMS_PROVIDER
        value: dev
      - key: TZ
        value: Asia/Almaty
      - key: NODE_ENV
        value: production

databases:
  - name: bilimhub-db
    plan: free
    region: frankfurt
    databaseName: bilimhub
    user: bilimhub
